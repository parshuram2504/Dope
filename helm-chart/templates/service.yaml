apiVersion: v1
kind: Service
metadata:
  name: {{ include "dope.fullname" . }}
  labels:
    {{- include "dope.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dope.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.service.port }}
      targetPort: http
